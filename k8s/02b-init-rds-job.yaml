apiVersion: batch/v1
kind: Job
metadata:
  name: init-rds-databases
  namespace: togglemaster
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-dbs
        image: postgres:15-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=== 1. Inicializando auth_db ==="
          PGPASSWORD=togglemasterpass123 psql -h auth-db.cwt324chtst9.us-east-1.rds.amazonaws.com -U auth_user -d auth_db -c "
          CREATE TABLE IF NOT EXISTS api_keys (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              key_hash VARCHAR(64) NOT NULL UNIQUE,
              is_active BOOLEAN DEFAULT true,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          "

          echo "=== 2. Inicializando flags_db ==="
          PGPASSWORD=togglemasterpass123 psql -h flag-db.cwt324chtst9.us-east-1.rds.amazonaws.com -U flag_user -d flags_db -c "
          CREATE TABLE IF NOT EXISTS flags (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) UNIQUE NOT NULL,
              description TEXT,
              is_enabled BOOLEAN NOT NULL DEFAULT false,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          CREATE OR REPLACE FUNCTION trigger_set_timestamp()
          RETURNS TRIGGER AS \$\$
          BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
          END;
          \$\$ LANGUAGE plpgsql;
          DROP TRIGGER IF EXISTS set_timestamp ON flags;
          CREATE TRIGGER set_timestamp
          BEFORE UPDATE ON flags
          FOR EACH ROW
          EXECUTE PROCEDURE trigger_set_timestamp();
          "

          echo "=== 3. Inicializando targeting_db ==="
          PGPASSWORD=togglemasterpass123 psql -h targeting-db.cwt324chtst9.us-east-1.rds.amazonaws.com -U targeting_user -d targeting_db -c "
          CREATE TABLE IF NOT EXISTS targeting_rules (
              id SERIAL PRIMARY KEY,
              flag_name VARCHAR(100) UNIQUE NOT NULL,
              is_enabled BOOLEAN NOT NULL DEFAULT true,
              rules JSONB NOT NULL,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          CREATE OR REPLACE FUNCTION trigger_set_timestamp()
          RETURNS TRIGGER AS \$\$
          BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
          END;
          \$\$ LANGUAGE plpgsql;
          DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;
          CREATE TRIGGER set_timestamp
          BEFORE UPDATE ON targeting_rules
          FOR EACH ROW
          EXECUTE PROCEDURE trigger_set_timestamp();
          "
          echo "=== Todos os 3 bancos RDS inicializados com sucesso! ==="
